<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 7th Birthday Jedi!</title>
<style>
    /* 1. BASE STYLES */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Arial Black', sans-serif;
        background: linear-gradient(to bottom, #001a4d 0%, #003d99 100%);
        color: white;
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* 2. ENTRANCE SCREEN (The Gift) */
    #surpriseEntrance {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom, #001a4d 0%, #003d99 100%);
        z-index: 9999;
        transition: opacity 0.8s ease;
    }
    .mystery-box {
        font-size: 8rem;
        cursor: pointer;
        animation: bounce 2s infinite;
        transition: transform 0.3s;
    }
    .mystery-box:hover { transform: scale(1.2); }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    /* 3. BACKGROUND ANIMATION */
    .lego-blocks {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }
    .lego-block {
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 4px;
        opacity: 0.2;
        animation: fallDown linear infinite;
    }
    @keyframes fallDown {
        from { transform: translateY(-100px) rotate(0deg); }
        to { transform: translateY(110vh) rotate(360deg); }
    }

    /* 4. CONTENT LAYOUT */
    .container {
        position: relative;
        z-index: 2;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
    }
    h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        text-shadow: 0 0 20px #0066ff;
        margin-bottom: 10px;
    }
    .name {
        font-size: clamp(3rem, 12vw, 6rem);
        color: #00ccff;
        text-shadow: 0 0 30px #0066ff;
    }
    .age {
        font-size: clamp(5rem, 15vw, 8rem);
        text-shadow: 0 10px 0 #001a4d, 0 0 50px #0066ff;
    }

    /* 5. VIDEO & IMAGES */
    .video-section {
        margin: 40px auto;
        max-width: 450px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 102, 255, 0.6);
    }
    .kpdh-logo img {
        max-width: 100%;
        width: 350px;
        filter: drop-shadow(0 0 30px #0066ff);
        margin: 40px 0;
    }

    /* 6. INTERACTIVE GRID */
    .balls-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin: 40px 0;
    }
    .ball {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #00ccff;
        border-radius: 15px;
        font-size: 2.5rem;
        padding: 20px 0;
        cursor: pointer;
        transition: 0.3s;
    }
    .ball:hover {
        background: #0066ff;
        transform: translateY(-5px);
    }

    /* 7. POPUP MODAL */
    .overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    }
    .popup {
        background: #001a4d;
        padding: 40px;
        border: 2px solid #00ccff;
        border-radius: 20px;
        max-width: 90%;
        width: 400px;
        text-align: center;
    }
    .close-btn {
        margin-top: 20px;
        padding: 10px 30px;
        background: #00ccff;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>

    <div id="surpriseEntrance">
        <div class="mystery-box" onclick="startParty()">🎁</div>
        <p style="margin-top: 20px; font-size: 1.5em;">Tap to open your surprise!</p>
    </div>

    <div class="lego-blocks" id="legoArea"></div>

    <div class="container">
        <header>
            <h1>🎉 HAPPY BIRTHDAY 🎉</h1>
            <div class="name">JEDI</div>
            <div class="age">7</div>
        </header>

      <div class="video-section">
    <div style="border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 40px rgba(0, 102, 255, 0.6); position: relative; padding-bottom: 177.78%; height: 0;">
        <iframe 
            src="https://drive.google.com/file/d/17wZBnGa-ycKAg_iQL57CHJ5ZaqYSnvqu/preview" 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
            allow="autoplay">
        </iframe>
    </div>
</div>
        <div class="kpdh-logo">
            <img src="https://i.ibb.co/Kz26wmnK/image.jpg" alt="Logo">
        </div>

        <div class="message" style="margin: 40px 0; font-size: 1.3em;">
            <p><strong>YOU'RE 7 TODAY!</strong></p>
            <p>Epic year, awesome experiences, and unforgettable moments await! ✨</p>
        </div>

        <div class="balls-grid">
            <div class="ball" onclick="pop('Today is ALL about you 🎉')">🎉</div>
            <div class="ball" onclick="pop('Can’t wait to see you grow 🚀')">🚀</div>
            <div class="ball" onclick="pop('Another year stronger 💪')">💪</div>
            <div class="ball" onclick="pop('You make every day fun! 🎈')">🎈</div>
            <div class="ball" onclick="pop('Happy Birthday Jedi! Hope you have the BEST day ever! 💙')">🎁</div>
            <div class="ball" onclick="pop('Make a wish 🌟')">🌟</div>
            <div class="ball" onclick="pop('Big bro is super proud of you! 💙')">⛹</div>
            <div class="ball" onclick="pop('Best birthday ever 🏆')">🏆</div>
            <div class="ball" onclick="pop('Let\'s goooo! 🎮')">🎮</div>
        </div>

        <footer style="margin-top: 60px;">
            <p style="font-size: 2em; font-weight: bold;">Love you bro! 💙</p>
            <p style="color: #00ccff; margin-top: 10px;">LET'S MAKE 2026 LEGENDARY! 🚀</p>
        </footer>
    </div>

    <div class="overlay" id="overlay" onclick="closePop()">
        <div class="popup" onclick="event.stopPropagation()">
            <p id="popText" style="font-size: 1.5rem;"></p>
            <button class="close-btn" onclick="closePop()">CLOSE</button>
        </div>
    </div>

    <script>
        // 1. Reveal Party
        function startParty() {
            const entrance = document.getElementById('surpriseEntrance');
            entrance.style.opacity = '0';
            setTimeout(() => {
                entrance.style.display = 'none';
            }, 800);
        }

        // 2. Interactive Balls
        function pop(text) {
            document.getElementById('popText').innerText = text;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closePop() {
            document.getElementById('overlay').style.display = 'none';
        }

        // 3. Falling Lego Bricks
        const area = document.getElementById('legoArea');
        const colors = ['#0066ff', '#00ccff', '#ffffff'];
        for(let i=0; i<15; i++) {
            const b = document.createElement('div');
            b.className = 'lego-block';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.background = colors[Math.floor(Math.random()*3)];
            b.style.animationDuration = (Math.random() * 5 + 5) + 's';
            b.style.animationDelay = Math.random() * 5 + 's';
            area.appendChild(b);
        }
    </script>
</body>
</html>
